[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyHydroGeophysX"
version = "0.4.0"
description = "A comprehensive Python package for integrating hydrological model outputs with geophysical forward modeling and inversion, featuring an automatic cross-modal geophysics agent for subsurface hydrology"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Hang Chen", email = "hangchen.work@gmail.com"},
]
keywords = [
    "geophysics", 
    "hydrology", 
    "ERT", 
    "seismic", 
    "tomography", 
    "inversion", 
    "MODFLOW", 
    "ParFlow",
    "watershed monitoring"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.21,<3.0",
    "scipy>=1.8,<3.0",
    "matplotlib>=3.5,<4.0",
    "palettable>=3.3,<4.0",
    "pandas>=1.3.0",
    "joblib>=1.2",
    "tqdm>=4.62",
]

[project.optional-dependencies]
geophysics = [
    "pygimli>=1.5.5,<2.0",
    "simpeg>=0.24,<1.0",
    "pymatsolver>=0.2",
    "flopy>=3.5,<4.0",
    "pftools>=1.3",
    # Limit supported native BLAS pools during parallel sounding solves to
    # reduce CPU oversubscription. Without this optional control, inversion
    # still runs but native libraries retain their configured thread counts;
    # see inversion.em1d_lci._single_threaded_blas.
    "threadpoolctl>=3.0",
]
# ResIPy reads a wider set of ERT instrument formats than this package does on
# its own, so it is preferred whenever it imports. It is GPL-3.0 and is kept as
# a separate optional install rather than a hard dependency: installing it is
# the user's choice. Desktop bundling requires a separate explicit opt-in;
# see THIRD_PARTY_NOTICES.md for distribution and provenance tracking.
ert = [
    "resipy>=3.4",
]
adtlert = [
    "adtlert[cuda12]>=0.1,<0.2; python_version >= '3.11'",
    "cupy-cuda12x[ctk]>=14,<15; python_version >= '3.11'",
    "nvidia-cudss-cu12>=0.7.1.6,<1; python_version >= '3.11' and sys_platform == 'win32'",
    "nvmath-python[cu12]>=0.8,<2; python_version >= '3.11' and sys_platform == 'win32'",
    "pygimli>=1.5.5,<2.0; python_version >= '3.11'",
]
gpu = [
    "cupy-cuda12x[ctk]>=14,<15",
]
agents = [
    "openai",
    "google-generativeai",
    "anthropic",
]
climate = [
    "pydaymet>=0.16.0",
    "pandas>=1.3.0",
    "xarray>=0.19.0",
]
webapp = [
    "streamlit>=1.35,<2.0",
    "plotly>=5.18,<7.0",
    "streamlit-plotly-events>=0.0.6",
    "pyarrow>=14.0",
]
desktop = [
    "pyproj>=3.4",
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "qtawesome>=1.2",
    "numpy>=1.21,<3.0",
    "pandas>=1.3.0",
]
# The 3D viewers (Mesh 3D, the velocity volume, the clip-plane preview). Kept
# separate from `desktop` because vtk is a large binary wheel that a headless or
# CI install has no use for.
#
# Check existing Qt/VTK installations before mixing pip and Conda packages.
# `conda list numpy` identifies NumPy's source, not every dependency's source.
# For a Conda-managed scientific stack, the corresponding install command is
# `conda install -c conda-forge pyvista pyvistaqt`.
desktop-3d = [
    "pyvista>=0.40",
    "pyvistaqt>=0.10",
    "vtk>=9.2",
]
seismic-raw = [
    "obspy>=1.4.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-gallery",
    "sphinx_rtd_theme",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
]
all = [
    "threadpoolctl>=3.0",
    "pygimli>=1.5.5,<2.0",
    "simpeg>=0.24,<1.0",
    "pymatsolver>=0.2",
    "flopy>=3.5,<4.0",
    "pftools>=1.3",
    "cupy-cuda12x[ctk]>=14,<15",
    "openai", "google-generativeai", "anthropic",
    "pydaymet>=0.16.0", "pandas>=1.3.0", "xarray>=0.19.0",
    "streamlit>=1.35,<2.0", "plotly>=5.18,<7.0", "streamlit-plotly-events>=0.0.6", "pyarrow>=14.0",
    "obspy>=1.4.0",
    "PySide6>=6.5", "pyqtgraph>=0.13", "qtawesome>=1.2",
    "pyvista>=0.40", "pyvistaqt>=0.10", "vtk>=9.2",
    "sphinx>=5.0", "sphinx-gallery", "sphinx_rtd_theme",
    "pytest>=7.0", "pytest-cov", "black", "flake8",
]

[project.scripts]
pyhydrogeophysx-gui = "PyHydroGeophysX.gui:main"
pyhydrogeophysx-workflow = "PyHydroGeophysX.workflows.cli:main"

[project.gui-scripts]
pyhydrogeophysx-studio = "PyHydroGeophysX.qt_apps.launcher:main"

[project.urls]
"Homepage" = "https://github.com/geohang/PyHydroGeophysX"
"Documentation" = "https://geohang.github.io/PyHydroGeophysX/"
"Repository" = "https://github.com/geohang/PyHydroGeophysX"
"Bug Tracker" = "https://github.com/geohang/PyHydroGeophysX/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["PyHydroGeophysX*"]

[tool.setuptools.package-data]
# Include compact Qt resources when present; the larger examples/ tree is not
# included by these package-data patterns.
PyHydroGeophysX = [
    "data/*",
    "data/qt_examples/*.md",
    "data/qt_examples/geo_hydrology/*",
    "data/qt_examples/seismic3d/line1/*",
    "data/qt_examples/seismic3d/line2/*",
    "data/qt_examples/seismic3d/line3/*",
    "data/em_examples/*",
    "data/em_examples/EastRiver_VTEM/*",
    "data/em_examples/synthetic_tem_lci/*",
    "*.md",
    "qt_apps/modules/*.md",
]
