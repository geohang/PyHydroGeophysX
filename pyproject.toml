[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyHydroGeophysX"
version = "0.3.0"
description = "A comprehensive Python package for integrating hydrological model outputs with geophysical forward modeling and inversion, featuring an automatic cross-modal geophysics agent for subsurface hydrology"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Hang Chen", email = "hangchen.work@gmail.com"},
]
keywords = [
    "geophysics", 
    "hydrology", 
    "ERT", 
    "seismic", 
    "tomography", 
    "inversion", 
    "MODFLOW", 
    "ParFlow",
    "watershed monitoring"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.19",
    "scipy>=1.5",
    "matplotlib>=3.2",
    "tqdm>=4.0",
    "pyarrow>=10.0",
]

[project.optional-dependencies]
geophysics = [
    "pygimli>=1.5",
    "simpeg>=0.20",
    "resipy>=3.4.0",
    "flopy",
    "joblib",
]
gpu = [
    "cupy",
]
agents = [
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
    "anthropic>=0.18.0",
    "markdown>=3.0",
]
climate = [
    "pydaymet>=0.16.0",
    "pandas>=1.3.0",
    "xarray>=0.19.0",
]
webapp = [
    "streamlit>=1.28",
    "plotly>=5.0",
    "streamlit-plotly-events>=0.0.6",
    "weasyprint>=60.0",
]
docs = [
    "sphinx>=7.1.2",
    "pydata-sphinx-theme>=0.14.0",
    "sphinx-gallery>=0.14.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.5.0",
    "nbsphinx>=0.9.1",
    "myst-parser>=2.0.0",
    "palettable",
    "Pillow",
]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
]
all = [
    "pygimli>=1.5",
    "simpeg>=0.20",
    "resipy>=3.4.0",
    "flopy",
    "joblib",
    "cupy",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "streamlit>=1.28",
    "plotly>=5.0",
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
]

[project.urls]
"Homepage" = "https://github.com/geohang/PyHydroGeophysX"
"Documentation" = "https://geohang.github.io/PyHydroGeophysX/"
"Repository" = "https://github.com/geohang/PyHydroGeophysX"
"Bug Tracker" = "https://github.com/geohang/PyHydroGeophysX/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["PyHydroGeophysX*"]

[tool.setuptools.package-data]
PyHydroGeophysX = ["data/*", "examples/*", "*.md"]
