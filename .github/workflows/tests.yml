name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-regressions:
    name: "Core numerical and data regressions (py3.11)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      # Only the package's own dependencies are installed here, so these are the
      # test files that run - not merely skip - without PyGIMLi, SimPEG, Qt or an
      # LLM SDK. The tests that need one of those run in the jobs that install it.
      - name: Run numerical, data and agent-runtime regressions
        run: >-
          python -m pytest -q
          tests/test_adapters.py
          tests/test_agent_live_regressions.py
          tests/test_electrode_tables.py
          tests/test_ert_formats.py
          tests/test_figure_style.py
          tests/test_forward_modelling.py
          tests/test_hydro_model_coupling.py
          tests/test_linear_solvers.py
          tests/test_materialize_and_vtk_export.py
          tests/test_method_paths.py
          tests/test_plan_interpolation.py
          tests/test_potential_fields.py
          tests/test_project_map.py
          tests/test_recovery.py
          tests/test_report_figures.py
          tests/test_report_structure.py
          tests/test_resipy_warning_filter.py
          tests/test_rock_physics_models.py
          tests/test_run_modes.py
          tests/test_runtime_contracts.py
          tests/test_section_clip.py
          tests/test_subsurface_insights.py
          tests/test_survey_timing.py
          tests/test_temperature_correction.py
          tests/test_temporal_weights.py
          tests/test_water_content_conversion.py
          tests/test_workflow_handlers.py

  adtlert:
    name: "ADTLERT selection and CPU fallback (ubuntu, py3.11)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ADTLERT selection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
          python -m pip install "adtlert>=0.1,<0.2" "pygimli>=1.5.5,<2.0"

      # No ADTLERT test module is left, so the job's contract is checked directly,
      # on a runner without a GPU: the extra imports, and a request for ADTLERT
      # falls back to the original PyHydro ERT engine instead of failing.
      - name: Check that ADTLERT imports and falls back to PyHydro without CUDA
        shell: python
        run: |
          from PyHydroGeophysX.inversion.ert_inversion import _resolve_ert_engine

          # Resolving the engine also sets ADTLERT's float64 switch, which ADTLERT
          # reads when it is first imported.
          engine = _resolve_ert_engine("adtlert")
          assert engine == "pyhydro", engine
          import adtlert  # noqa: F401
          import pygimli  # noqa: F401
          print("ADTLERT imports; without CUDA and cuDSS the ERT engine is", engine)

      # This job installs PyGIMLi, so the regressions that need it run here: the
      # Gauss-Newton loops (single, time-lapse ERT and SRT), forward modelling,
      # the petrophysics on real meshes, and the readers checked against it.
      - name: Run the PyGIMLi inversion and forward-modelling regressions
        run: >-
          python -m pytest -q
          tests/test_agent_live_regressions.py
          tests/test_ert_formats.py
          tests/test_forward_modelling.py
          tests/test_hydro_model_coupling.py
          tests/test_inversion_numerics.py
          tests/test_plotting_fixes.py
          tests/test_report_figures.py
          tests/test_rock_physics_models.py
          tests/test_structure_mesh_and_figures.py
          tests/test_subsurface_insights.py
          tests/test_water_content_conversion.py

  adtlert-windows:
    name: "ADTLERT Windows metadata and engine fallback (py3.11)"
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ADTLERT fallback test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
          python -m pip install "adtlert>=0.1,<0.2" "pygimli>=1.5.5,<2.0"

      - name: Verify CUDA 12 and Windows cuDSS metadata
        shell: python
        run: |
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          dependencies = project["project"]["optional-dependencies"]
          assert any("cupy-cuda12x" in item for item in dependencies["gpu"])
          assert any("cupy-cuda12x" in item for item in dependencies["adtlert"])
          assert any("nvidia-cudss-cu12" in item for item in dependencies["adtlert"])
          assert any("nvmath-python" in item for item in dependencies["adtlert"])

      - name: Check that ADTLERT imports and falls back to PyHydro without CUDA
        shell: python
        run: |
          from PyHydroGeophysX.inversion.ert_inversion import _resolve_ert_engine

          # Resolving the engine also sets ADTLERT's float64 switch, which ADTLERT
          # reads when it is first imported.
          engine = _resolve_ert_engine("adtlert")
          assert engine == "pyhydro", engine
          import adtlert  # noqa: F401
          import pygimli  # noqa: F401
          print("ADTLERT imports; without CUDA and cuDSS the ERT engine is", engine)

  qt-model-viewer:
    name: "Qt Model Viewer (ubuntu, py3.11)"
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # Install Qt's EGL/GL runtime dependencies explicitly for offscreen tests,
      # so the tests do not rely on the runner image's preinstalled libraries.
      - name: Install the system libraries Qt links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install lightweight desktop dependencies
        run: python -m pip install -e ".[desktop]" pytest

      # The Qt tests skip themselves when Qt cannot load, which is right for a
      # contributor's machine and wrong for the job whose whole purpose is to
      # exercise Qt: without this it would report success having run nothing.
      - name: Verify the Qt stack imports
        run: python -c "import PySide6.QtGui, pyqtgraph; print('Qt import OK')"

      # The studio's pages and windows without PyGIMLi: these files run their Qt
      # tests here, and skip the few that need a PyGIMLi mesh.
      - name: Run the Qt studio tests
        run: >-
          pytest -q
          tests/test_adapters.py
          tests/test_control_column.py
          tests/test_electrode_tables.py
          tests/test_ert_page_inputs.py
          tests/test_project_map.py
          tests/test_run_modes.py
          tests/test_studio_pages.py
          tests/test_studio_window.py
          tests/test_workflow_pause.py
