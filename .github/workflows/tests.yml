name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "test (ubuntu, py3.11)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: python -m pip install -e . pytest pyarrow "pygimli>=1.5.5,<2.0"

      - name: Import smoke test
        run: python -c "import PyHydroGeophysX; print('Import OK:', PyHydroGeophysX.__version__)"

      - name: Run tests
        run: pytest -q

  adtlert:
    name: "ADTLERT selection and CPU fallback (ubuntu, py3.11)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ADTLERT selection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
          python -m pip install "adtlert>=0.1,<0.2" "pygimli>=1.5.5,<2.0"

      - name: Run ADTLERT integration tests
        run: >-
          pytest -q
          tests/test_ert_backend_selection.py
          tests/test_ert_adtlert_backend.py
          tests/test_ert_mesh_import.py

  adtlert-windows:
    name: "ADTLERT Windows metadata and engine fallback (py3.11)"
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ADTLERT fallback test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
          python -m pip install "adtlert>=0.1,<0.2" "pygimli>=1.5.5,<2.0"

      - name: Verify CUDA 12 and Windows cuDSS metadata
        shell: python
        run: |
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          dependencies = project["project"]["optional-dependencies"]
          assert any("cupy-cuda12x" in item for item in dependencies["gpu"])
          assert any("cupy-cuda12x" in item for item in dependencies["adtlert"])
          assert any("nvidia-cudss-cu12" in item for item in dependencies["adtlert"])
          assert any("nvmath-python" in item for item in dependencies["adtlert"])

      - name: Run ADTLERT selection tests
        run: >-
          pytest -q
          tests/test_ert_backend_selection.py
          tests/test_ert_adtlert_backend.py

  qt-model-viewer:
    name: "Qt Model Viewer (ubuntu, py3.11)"
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # PySide6 wheels ship Qt but not the system libraries Qt links against,
      # and QtGui loads libEGL/libGL even under the offscreen platform. The
      # runner image carries neither.
      - name: Install the system libraries Qt links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install lightweight desktop dependencies
        run: python -m pip install -e ".[desktop]" pytest

      # The test module skips itself when Qt cannot load, which is right for a
      # contributor's machine and wrong for the job whose whole purpose is to
      # exercise Qt: without this it would report success having run nothing.
      - name: Verify the Qt stack imports
        run: python -c "import PySide6.QtGui, pyqtgraph; print('Qt import OK')"

      - name: Run Qt Model Viewer smoke test
        run: pytest -q tests/test_qt_model_viewer.py
