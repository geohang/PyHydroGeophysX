name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Linux and macOS: full test suite via conda (PyGIMLi conda-forge wheels are reliable)
  test-unix:
    name: "test (${{ matrix.os }}, py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    # Non-blocking: if a specific OS/Python combo can't resolve the environment
    # (e.g., a new pygimli release breaks the solver), it shows as a warning
    # rather than failing the whole workflow.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11"]
        experimental: [false]
        include:
          # Python 3.12 is experimental — newer than our tested range
          - os: ubuntu-latest
            python-version: "3.12"
            experimental: true
          - os: macos-latest
            python-version: "3.12"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          create-args: python=${{ matrix.python-version }}
          init-shell: bash
          cache-environment: true

      - name: Install package (editable) and dev extras
        shell: bash -el {0}
        run: pip install -e ".[dev]"

      - name: Run tests
        shell: bash -el {0}
        run: pytest --cov=PyHydroGeophysX -q

  # Windows: conda-based install, scoped to pure-python smoke tests.
  # PyGIMLi Windows wheels from conda-forge are supported but can be slow on
  # ephemeral CI runners; full PyGIMLi tests are therefore excluded.
  # All Python versions are marked continue-on-error so a single resolver
  # failure does not hide results for the other versions.
  test-windows:
    name: "test (windows-latest, py${{ matrix.python-version }}) [smoke]"
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          create-args: python=${{ matrix.python-version }}
          init-shell: powershell
          cache-environment: true

      - name: Install package (editable) and dev extras
        shell: pwsh
        run: pip install -e ".[dev]"

      - name: Run smoke tests (import and pure-Python subset)
        shell: pwsh
        run: pytest tests/ -q -k "import" --ignore=tests/test_inversion.py
