name: tests

on:
  push:
    branches: [main, softx-r2-revisions]
  pull_request:
    branches: [main]

jobs:
  # Linux and macOS: full test suite via conda (PyGIMLi conda-forge wheels are reliable)
  test-unix:
    name: "test (${{ matrix.os }}, py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          create-args: python=${{ matrix.python-version }}
          init-shell: bash
          cache-environment: true

      - name: Install package (editable) and dev extras
        shell: bash -el {0}
        run: pip install -e ".[dev]"

      - name: Run tests
        shell: bash -el {0}
        run: pytest --cov=PyHydroGeophysX -q

  # Windows: conda-based install, scoped to pure-python smoke tests
  # PyGIMLi Windows wheels from conda-forge are supported but may be slow to
  # install, so we restrict the matrix entry to import/smoke tests only.
  # This ensures Windows is represented in CI as committed in the R1 response.
  test-windows:
    name: "test (windows-latest, py${{ matrix.python-version }}) [smoke]"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          create-args: python=${{ matrix.python-version }}
          init-shell: powershell
          cache-environment: true

      - name: Install package (editable) and dev extras
        shell: pwsh
        run: pip install -e ".[dev]"

      - name: Run smoke tests (import and pure-Python subset)
        shell: pwsh
        run: pytest tests/ -q -k "import" --ignore=tests/test_inversion.py
