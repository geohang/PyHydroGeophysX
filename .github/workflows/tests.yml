name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "test (${{ matrix.os }}, py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11"]
        experimental: [false]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            experimental: true
          - os: macos-latest
            python-version: "3.12"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba with pygimli
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: test-env
          init-shell: bash
          create-args: >-
            -c gimli
            -c conda-forge
            python=${{ matrix.python-version }}
            numpy
            scipy>=1.8,<3.0
            matplotlib
            joblib
            tqdm
            pytest
            pytest-cov
            pygimli>=1.5.5
          cache-environment: true

      - name: Install package (editable, no heavy optional deps)
        shell: bash -el {0}
        run: pip install -e . --no-deps

      - name: Run tests
        shell: bash -el {0}
        run: python -m pytest tests/ -v --tb=short -p no:warnings

