name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "test (ubuntu, py3.10)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba with pygimli
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: test-env
          init-shell: bash
          condarc: |
            channel_priority: strict
            remote_connect_timeout_secs: 30
            remote_read_timeout_secs: 120
          create-args: >-
            -c gimli
            -c conda-forge
            python=3.10
            numpy>=2.2,<2.3
            scipy>=1.8,<3.0
            matplotlib
            pandas
            joblib
            tqdm
            pytest
            pygimli=1.5.5

      - name: Install package (editable, no heavy optional deps)
        shell: bash -el {0}
        run: pip install -e . --no-deps

      - name: Run tests
        shell: bash -el {0}
        run: python -m pytest tests/ -v --tb=short -p no:warnings

