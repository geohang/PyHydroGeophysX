name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "test (ubuntu, py3.11)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: python -m pip install -e . pytest pyarrow

      - name: Import smoke test
        run: python -c "import PyHydroGeophysX; print('Import OK:', PyHydroGeophysX.__version__)"

      - name: Run tests
        run: pytest -q

  adtlert:
    name: "ADTLERT backend (ubuntu, py3.11, CPU)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
          python -m pip install "adtlert>=0.1,<0.2" "pygimli>=1.5.5,<2.0"

      - name: Run ADTLERT integration tests
        run: pytest -q tests/test_ert_adtlert_backend.py tests/test_ert_mesh_import.py
