name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No window to draw in, and pygimli's first plt.show() must not wait on one.
env:
  MPLBACKEND: Agg

jobs:
  core-regressions:
    name: "Core numerical and data regressions (py3.11)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      # Every published test file, found by pytest rather than listed here, so
      # removing one never breaks CI. Local-only tests are listed in .gitignore
      # and absent from the checkout. Only the package's own dependencies are
      # installed in this job: a test that needs an optional package must skip
      # without it, and runs in the job that installs that package.
      - name: Run the tests
        run: python -m pytest -q tests/

  adtlert:
    name: "ADTLERT selection and CPU fallback (ubuntu, py3.11)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ADTLERT selection dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
          python -m pip install "adtlert>=0.1,<0.2" "pygimli>=1.5.5,<2.0"

      # No ADTLERT test module is left, so the job's contract is checked directly,
      # on a runner without a GPU: the extra imports, and a request for ADTLERT
      # falls back to the original PyHydro ERT engine instead of failing.
      - name: Check that ADTLERT imports and falls back to PyHydro without CUDA
        shell: python
        run: |
          from PyHydroGeophysX.inversion.ert_inversion import _resolve_ert_engine

          # Resolving the engine also sets ADTLERT's float64 switch, which ADTLERT
          # reads when it is first imported.
          engine = _resolve_ert_engine("adtlert")
          assert engine == "pyhydro", engine
          import adtlert  # noqa: F401
          import pygimli  # noqa: F401
          print("ADTLERT imports; without CUDA and cuDSS the ERT engine is", engine)

      # The same tests with PyGIMLi installed, so those that need it run too.
      - name: Run the tests with PyGIMLi
        run: python -m pytest -q tests/

  adtlert-windows:
    name: "ADTLERT Windows metadata and engine fallback (py3.11)"
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ADTLERT fallback test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
          python -m pip install "adtlert>=0.1,<0.2" "pygimli>=1.5.5,<2.0"

      - name: Verify CUDA 12 and Windows cuDSS metadata
        shell: python
        run: |
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          dependencies = project["project"]["optional-dependencies"]
          assert any("cupy-cuda12x" in item for item in dependencies["gpu"])
          assert any("cupy-cuda12x" in item for item in dependencies["adtlert"])
          assert any("nvidia-cudss-cu12" in item for item in dependencies["adtlert"])
          assert any("nvmath-python" in item for item in dependencies["adtlert"])

      - name: Check that ADTLERT imports and falls back to PyHydro without CUDA
        shell: python
        run: |
          from PyHydroGeophysX.inversion.ert_inversion import _resolve_ert_engine

          # Resolving the engine also sets ADTLERT's float64 switch, which ADTLERT
          # reads when it is first imported.
          engine = _resolve_ert_engine("adtlert")
          assert engine == "pyhydro", engine
          import adtlert  # noqa: F401
          import pygimli  # noqa: F401
          print("ADTLERT imports; without CUDA and cuDSS the ERT engine is", engine)

  qt-model-viewer:
    name: "Qt Model Viewer (ubuntu, py3.11)"
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # Install Qt's EGL/GL runtime dependencies explicitly for offscreen tests,
      # so the tests do not rely on the runner image's preinstalled libraries.
      - name: Install the system libraries Qt links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install lightweight desktop dependencies
        run: python -m pip install -e ".[desktop]" pytest

      # Fail loudly if Qt itself cannot load, rather than report success having
      # checked nothing.
      - name: Verify the Qt stack imports
        run: python -c "import PySide6.QtGui, pyqtgraph; print('Qt import OK')"

      # What the studio needs to start: its entry point and main window import
      # with only the desktop extra installed.
      - name: Check that the studio imports with the desktop extra
        run: python -c "import PyHydroGeophysX.qt_apps.launcher, PyHydroGeophysX.qt_apps.main_window; print('Studio imports OK')"

      # The same tests with Qt installed, so any that need Qt run here.
      - name: Run the tests with Qt
        run: python -m pytest -q tests/
