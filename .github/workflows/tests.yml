name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "test (${{ matrix.os }}, py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10"]
        experimental: [false]

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba with pygimli
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: test-env
          init-shell: bash
          condarc: |
            channel_priority: strict
            remote_connect_timeout_secs: 30
            remote_read_timeout_secs: 120
          create-args: >-
            -c gimli
            -c conda-forge
            python=${{ matrix.python-version }}
            numpy=1.21.*
            scipy>=1.8,<3.0
            matplotlib
            pandas
            joblib
            tqdm
            pytest
            pytest-cov
            pygimli=1.5.5

      - name: Install package (editable, no heavy optional deps)
        shell: bash -el {0}
        run: pip install -e . --no-deps

      - name: Run tests
        shell: bash -el {0}
        run: python -m pytest tests/ -v --tb=short -p no:warnings

