name: pyhydrogeophysx
channels:
  - conda-forge
  - nodefaults
# NOTE: PyGIMLi (pygimli/pgcore) cannot be installed via conda on Streamlit Cloud
# Linux because pgcore has no Python ≥3.12 Linux builds, and Streamlit Cloud's
# conda now requires conda-anaconda-tos >=0.2.2 (Python 3.13 only).
# For local development with PyGIMLi use:
#   conda create -n pyhydrogeophysx -c gimli -c conda-forge pygimli=1.5.5 python=3.11
dependencies:
  - python=3.11
  - pip
  - pip:
      # Web app and pure-Python/scientific packages install faster as wheels.
      - scipy>=1.8,<3.0
      - matplotlib>=3.5,<4.0
      - pandas>=1.3
      - pyarrow>=14.0
      - plotly>=5.18,<7.0
      - streamlit>=1.35,<2.0
      - streamlit-plotly-events>=0.0.6
      - joblib>=1.2
      - tqdm>=4.62
      - simpeg>=0.24,<1.0
      - flopy>=3.5,<4.0
