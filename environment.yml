name: pyhydrogeophysx
channels:
  - gimli
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  # Keep the conda solve small: PyGIMLi/pgcore need conda binary deps.
  - numpy>=2.2,<2.3
  - pygimli=1.5.5
  - pip
  - pip:
      # Web app and pure-Python/scientific packages install faster as wheels.
      - scipy>=1.8,<3.0
      - matplotlib>=3.5,<4.0
      - pandas>=1.3
      - pyarrow>=14.0
      - plotly>=5.18,<7.0
      - streamlit>=1.35,<2.0
      - streamlit-plotly-events>=0.0.6
      - joblib>=1.2
      - tqdm>=4.62
      - simpeg>=0.24,<1.0
      - flopy>=3.5,<4.0
