<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body, #overlay {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    #overlay {
      cursor: crosshair;
    }

    #hint {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(15, 76, 117, 0.88);
      color: #fff;
      font: 12px/1.25 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 0;
      transition: opacity 120ms ease;
      pointer-events: none;
      white-space: nowrap;
    }

    body.active #hint {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="overlay" aria-label="Ctrl-click plot picking overlay">
    <div id="hint">Ctrl-click to pick</div>
  </div>
  <script>
    const COMPONENT_READY = "streamlit:componentReady";
    const SET_COMPONENT_VALUE = "streamlit:setComponentValue";
    const SET_FRAME_HEIGHT = "streamlit:setFrameHeight";
    const RENDER_EVENT = "streamlit:render";
    const API_VERSION = 1;

    let args = {};
    let ctrlDown = false;

    function send(type, data) {
      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true, type: type }, data),
        "*"
      );
    }

    function setFrameHeight(height) {
      send(SET_FRAME_HEIGHT, { height: height });
    }

    function setComponentValue(value) {
      send(SET_COMPONENT_VALUE, { value: value, dataType: "json" });
    }

    function configureFrame() {
      const height = Number(args.height || 560);
      const marginLeft = Number(args.margin_left || 0);
      const marginRight = Number(args.margin_right || 0);
      const marginTop = Number(args.margin_top || 0);
      const marginBottom = Number(args.margin_bottom || 0);
      const innerHeight = Math.max(1, height - marginTop - marginBottom);
      const frame = window.frameElement;
      document.documentElement.style.height = innerHeight + "px";
      document.body.style.height = innerHeight + "px";
      if (frame) {
        frame.style.height = innerHeight + "px";
        frame.style.marginTop = "-" + Math.max(0, height - marginTop) + "px";
        frame.style.marginLeft = marginLeft + "px";
        frame.style.marginBottom = marginBottom + "px";
        frame.style.width = "calc(100% - " + (marginLeft + marginRight) + "px)";
        frame.style.position = "relative";
        frame.style.zIndex = "20";
        frame.style.background = "transparent";
        frame.style.pointerEvents = "auto";
      }
      setFrameHeight(innerHeight);
      updateActiveState();
    }

    function updateActiveState() {
      const active = Boolean(args.always_active) || ctrlDown;
      document.body.classList.toggle("active", active);
    }

    function handleKey(event) {
      const nextCtrl = Boolean(event.ctrlKey || event.metaKey);
      if (nextCtrl !== ctrlDown) {
        ctrlDown = nextCtrl;
        updateActiveState();
      }
    }

    window.addEventListener("keydown", handleKey, true);
    window.addEventListener("keyup", handleKey, true);
    try {
      window.parent.addEventListener("keydown", handleKey, true);
      window.parent.addEventListener("keyup", handleKey, true);
    } catch (error) {
      // Parent access can be restricted by browser sandboxing; local key events still work.
    }

    document.getElementById("overlay").addEventListener("click", function(event) {
      const modifierHeld = Boolean(args.always_active) || event.ctrlKey || event.metaKey || ctrlDown;
      if (!modifierHeld) {
        return;
      }
      event.preventDefault();
      event.stopPropagation();
      const rect = event.currentTarget.getBoundingClientRect();
      setComponentValue({
        pixel_x: event.clientX - rect.left,
        pixel_y: event.clientY - rect.top,
        width: rect.width,
        height: rect.height,
        ctrlKey: Boolean(event.ctrlKey || ctrlDown),
        metaKey: Boolean(event.metaKey),
        timestamp: Date.now()
      });
    }, true);

    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === RENDER_EVENT) {
        args = event.data.args || {};
        configureFrame();
      }
    });

    send(COMPONENT_READY, { apiVersion: API_VERSION });
    configureFrame();
  </script>
</body>
</html>
